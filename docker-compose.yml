x-app: &app
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  cpus: 1.0
  labels:
    lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
  volumes:
    - ./infra/health/app.sh:/opt/lab/healthcheck.sh:ro
  healthcheck:
    test: [CMD, bash, /opt/lab/healthcheck.sh]
    interval: 5s
    timeout: 4s
    start_period: 40s
    retries: 20

x-redis: &redis
  image: redis:7.4-alpine
  command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 96mb, --maxmemory-policy, noeviction]
  mem_limit: 128m
  cpus: 0.5
  labels:
    lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
  healthcheck:
    test: [CMD, redis-cli, ping]
    interval: 3s
    timeout: 2s
    retries: 20

services:
  queue-redis:
    <<: *redis
    volumes:
      - queue-data:/data

  booking-redis:
    <<: *redis
    volumes:
      - booking-data:/data

  mysql:
    image: mysql:8.4
    command: [--innodb-buffer-pool-size=64M, --performance-schema=OFF]
    mem_limit: 768m
    cpus: 1.0
    labels:
      lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_USER: lab_app
      MYSQL_PASSWORD: ${LAB_DB_PASSWORD:?Use scripts/lab.sh up}
      MYSQL_ROOT_PASSWORD: ${LAB_MYSQL_ROOT_PASSWORD:?Use scripts/lab.sh up}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 30

  waiting-api:
    <<: *app
    image: ${COMPOSE_PROJECT_NAME}-waiting:local
    build:
      context: .
      labels:
        lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
      args:
        APP_DIR: app-waiting
    environment:
      SPRING_PROFILES_ACTIVE: api,walking-skeleton
      QUEUE_REDIS_HOST: queue-redis
      WAIT_SECRET: ${WAIT_SECRET:?Use scripts/lab.sh up}
      QUEUE_ADMIN_KEY: ${QUEUE_ADMIN_KEY:?Use scripts/lab.sh up}
    depends_on:
      queue-redis:
        condition: service_healthy

  waiting-worker:
    <<: *app
    image: ${COMPOSE_PROJECT_NAME}-waiting:local
    pull_policy: never
    environment:
      SPRING_PROFILES_ACTIVE: worker,walking-skeleton
      QUEUE_REDIS_HOST: queue-redis
    depends_on:
      queue-redis:
        condition: service_healthy

  fake-ext:
    <<: *app
    image: ${COMPOSE_PROJECT_NAME}-fake-ext:local
    build:
      context: .
      labels:
        lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
      args:
        APP_DIR: tools/fake-ext
    environment:
      SPRING_PROFILES_ACTIVE: walking-skeleton

  booking:
    <<: *app
    image: ${COMPOSE_PROJECT_NAME}-booking:local
    build:
      context: .
      labels:
        lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
      args:
        APP_DIR: app-booking
    environment:
      SPRING_PROFILES_ACTIVE: walking-skeleton
      BOOKING_DB_URL: jdbc:mysql://mysql:3306/ticketing?allowPublicKeyRetrieval=true&useSSL=false
      BOOKING_DB_USERNAME: lab_app
      BOOKING_DB_PASSWORD: ${LAB_DB_PASSWORD:?Use scripts/lab.sh up}
      BOOKING_REDIS_HOST: booking-redis
      LAB_WALKING_SKELETON_PROVIDER_URL: http://fake-ext:8080
    depends_on:
      mysql:
        condition: service_healthy
      booking-redis:
        condition: service_healthy
      fake-ext:
        condition: service_healthy

  worker:
    <<: *app
    image: ${COMPOSE_PROJECT_NAME}-worker:local
    build:
      context: .
      labels:
        lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
      args:
        APP_DIR: app-worker
    environment:
      SPRING_PROFILES_ACTIVE: walking-skeleton
      WORKER_DB_URL: jdbc:mysql://mysql:3306/ticketing?allowPublicKeyRetrieval=true&useSSL=false
      WORKER_DB_USERNAME: lab_app
      WORKER_DB_PASSWORD: ${LAB_DB_PASSWORD:?Use scripts/lab.sh up}
      BOOKING_REDIS_HOST: booking-redis
    depends_on:
      booking:
        condition: service_healthy
      booking-redis:
        condition: service_healthy

  edge:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    labels:
      lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
    ports:
      - '127.0.0.1:${LAB_HTTP_PORT:-18080}:8080'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/healthz | grep -q UP']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      waiting-api:
        condition: service_healthy
      booking:
        condition: service_healthy

volumes:
  queue-data:
    labels:
      lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
  booking-data:
    labels:
      lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
  mysql-data:
    labels:
      lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}

networks:
  default:
    labels:
      lab.ticketing.owner: ${LAB_OWNER:?Use scripts/lab.sh up}
